<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Material de Clase Gratis</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.0/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/fontawesome-all.min.css">
    <link rel="stylesheet" href="assets/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="assets/css/app.css">

    <style>
        .row {
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="freeclassmaterial-section">

        <div class="container-fluid p-0">
            <div class="row justify-content-center align-items-center flex-wrap">
                <div class="col-12 col-md-8 d-flex justify-content-center my-4 my-md-5">
                    <img src="https://megacursos.com/themes/megacursos/assets/images/logo.png" alt="">
                </div>
                <div class="col-12 col-md-8 my-4 my-md-5">
                    <form action="/descargas1-email" method="POST">
                        <div class="text-center d-flex flex-colum flex-wrap justify-content-center">
                            <h2 class="title-mega font-weight-normal text-white">Para descargar el material de la clase</h2>
                            <h2 class="title-mega font-weight-normal text-warning">Introduce correctamente tu correo</h2>
                        </div>
                        <div class="form-row my-4 my-md-5 flex-colum flex-wrap justify-content-center">
                            <div class="col-10 col-md-8 col-lg-6 text-center">
                                <div class="form-group">
                                    <input type="email" class="form-control form-control-lg" placeholder="Tu correo *" name="correo" required>
                                </div>
                                <button type="submit" class="btn btn-warning my-4 my-md-5">Aceptar y Continuar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>
    <!-- CDN -->

    <script type="text/javascript">
        let errors = '';

        if (errors !== "" && errors !== null) {
            Swal.fire(
                'Wow!',
                '¡Debe espeficiar un correo!',
                'error'
            )
        }
    </script>
</body>

</html>
